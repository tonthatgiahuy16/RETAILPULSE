[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "retailpulse"
version = "0.1.0"
description = "RetailPulse data engineering learning project"
requires-python = ">=3.13"
dependencies = ["openpyxl>=3.1,<4", "psycopg[binary]>=3.2,<4"]

[tool.setuptools.packages.find]
where = ["src"]
