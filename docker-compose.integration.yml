name: retailpulse-integration

services:
  postgres-test:
    image: postgres:16
    environment:
      POSTGRES_DB: retailpulse_test
      POSTGRES_USER: postgres
      # Trust is safe only here: this disposable test service binds to loopback.
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "127.0.0.1:${RETAILPULSE_TEST_PG_PORT:-55432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d retailpulse_test"]
      interval: 5s
      timeout: 5s
      retries: 12
