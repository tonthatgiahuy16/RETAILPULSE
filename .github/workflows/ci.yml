name: pipeline-ci

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: retailpulse_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d retailpulse_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      PYTHONPATH: src
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/retailpulse_test
      RETAILPULSE_INTEGRATION_DSN: postgresql://postgres:postgres@localhost:5432/retailpulse_test
      RETAILPULSE_INTEGRATION_TEST: "1"
      DBT_HOST: localhost
      DBT_PORT: "5432"
      DBT_USER: postgres
      DBT_PASSWORD: postgres
      DBT_DATABASE: retailpulse_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install project, dbt adapter, and model dependencies
        run: python -m pip install '.[transform,model]'
      - name: Run unit and PostgreSQL integration tests
        run: python -m unittest discover -s tests -v
      - name: Validate Power BI project metadata
        run: python scripts/validate_powerbi_project.py
      - name: Build and validate portfolio dashboard brief
        run: >-
          python scripts/build_dashboard.py
          --eval-json tests/fixtures/dashboard_repurchase_model_evaluation.json
          --run-json tests/fixtures/dashboard_pipeline_run.json
          --output .test-tmp/ci-dashboard/index.html
      - name: Bootstrap a clean database with the operational runner
        run: python scripts/run_pipeline.py
      - name: Ingest temporal fixture and run data-backed SQL gates
        run: python scripts/run_pipeline.py --workbook tests/fixtures/mini_retail.xlsx --source-uri https://example.test/retailpulse/mini_retail.xlsx --source-retrieved-at 2026-11-11T00:00:00+07:00
      - name: Run the governed DAG once
        run: python scripts/run_dag.py --output data/processed/orchestration/ci_run.json
      - name: Upload the DAG run record
        uses: actions/upload-artifact@v4
        with:
          name: dag-run-record
          path: data/processed/orchestration/ci_run.json
      - name: Run dbt contract build
        run: |
          cp dbt/profiles.example.yml dbt/profiles.yml
          dbt build --project-dir dbt --profiles-dir dbt
